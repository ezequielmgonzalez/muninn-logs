<!-- @dsCard group="Profile" height=620 subtitle="Banda de sección + ranking de líderes con retrato real" -->
<!doctype html>
<html>
<head>
<style>
  .lrc-wrap { max-width: 520px; margin: 24px auto; font-family: var(--font-body); }
  .paint-bg { position: absolute; inset: -14px -30px; opacity: 0.26; filter: url(#mjRoughBlur); }
  .paint-fg { position: absolute; inset: -3px -9px; filter: url(#mjRough); }
  .lrc-band { position: relative; height: 46px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .lrc-band-text { position: relative; z-index: 2; padding: 0 22px; }
  .lrc-select {
    position: relative; z-index: 2; margin-right: 4px;
    font-family: var(--font-body); font-size: 12px; color: var(--ink-muted);
    border: 1px solid var(--ink-muted); border-radius: 3px; padding: 6px 12px; background: transparent;
  }
  .lrc-row { display: flex; align-items: center; gap: 14px; margin-bottom: 17px; }
  .lrc-avatar { width: 46px; height: 46px; border-radius: 4px; border: 2px solid var(--bronze); box-shadow: 0 2px 5px rgba(43,32,20,0.35); object-fit: cover; object-position: center 20%; flex: 0 0 auto; }
  .lrc-track { position: relative; height: 24px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="mjRough" x="-15%" y="-60%" width="130%" height="220%">
    <feTurbulence type="fractalNoise" baseFrequency="0.014 0.11" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="9" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="mjRoughBlur" x="-25%" y="-120%" width="150%" height="340%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.09" numOctaves="2" seed="3" result="noise2"/>
    <feDisplacementMap in="SourceGraphic" in2="noise2" scale="13" xChannelSelector="R" yChannelSelector="G"/>
    <feGaussianBlur stdDeviation="3"/>
  </filter>
</svg>

<div class="lrc-wrap" id="lrc-root">
  <div class="lrc-band">
    <div class="paint-bg" style="background: var(--ink);"></div>
    <div class="paint-fg" style="background: var(--ink);"></div>
    <div class="lrc-band-text band-md" style="color: var(--band-text); text-transform: uppercase; letter-spacing: 0.14em;">Líderes más jugados</div>
    <select class="lrc-select" id="lrc-stat" aria-label="Elegir stat">
      <option value="winRate">Win Rate</option>
      <option value="avgPlacement">Avg Place</option>
      <option value="avgInvestigation">Avg Investigación</option>
      <option value="avgPoints">Avg Puntos</option>
    </select>
  </div>
  <div id="lrc-rows"></div>
  <p class="caption" style="color: var(--ink-muted); font-style: italic;">Datos de muestra, a modo ilustrativo.</p>
</div>

<script>
(function () {
  var LEADERS = [
    { name: "Baroness",  color: "var(--chart-2)", img: "/_blob/436fcb2f8fd23e0d543dae8ee44f9b69", winRate: 41, avgPlacement: 1.8, avgInvestigation: 6.2,  avgPoints: 79 },
    { name: "Captain",   color: "var(--chart-3)", img: "/_blob/4d488e22047f8c199cd58513cf4da277", winRate: 34, avgPlacement: 2.1, avgInvestigation: 9.4,  avgPoints: 71 },
    { name: "Journalist",color: "var(--chart-7)", img: "/_blob/a3566b2f251801513bf1f22a4fadc279", winRate: 31, avgPlacement: 2.3, avgInvestigation: 8.0,  avgPoints: 70 },
    { name: "Falconer",  color: "var(--chart-6)", img: "/_blob/5dd7491c5dc9edfc55d6c9d2cef526be", winRate: 28, avgPlacement: 2.4, avgInvestigation: 7.8,  avgPoints: 66 },
    { name: "Mystic",    color: "var(--chart-1)", img: "/_blob/6bbd33ea5e6332b56e96fef6b67fd8d8", winRate: 25, avgPlacement: 2.5, avgInvestigation: 5.4,  avgPoints: 64 },
    { name: "Professor", color: "var(--chart-5)", img: "/_blob/784230044f4a865b59e4e6757bddcdab", winRate: 22, avgPlacement: 2.7, avgInvestigation: 11.6, avgPoints: 68 },
    { name: "Explorer",  color: "var(--chart-4)", img: "/_blob/6dff3cdef2274dfabe7680158ce45c6e", winRate: 19, avgPlacement: 2.9, avgInvestigation: 8.1,  avgPoints: 60 },
    { name: "Mechanic",  color: "var(--chart-8)", img: "/_blob/f3fa9a096472fa5aa9fb3e226aadad3d", winRate: 16, avgPlacement: 3.0, avgInvestigation: 4.9,  avgPoints: 58 }
  ];
  var METRICS = {
    winRate: { higherIsBetter: true, fmt: function (v) { return v + "%"; } },
    avgPlacement: { higherIsBetter: false, fmt: function (v) { return "#" + v.toFixed(1); } },
    avgInvestigation: { higherIsBetter: true, fmt: function (v) { return v.toFixed(1); } },
    avgPoints: { higherIsBetter: true, fmt: function (v) { return v; } }
  };
  var rowsEl = document.getElementById("lrc-rows");
  var pickerEl = document.getElementById("lrc-stat");

  function scale(key, v) {
    var m = METRICS[key];
    if (!m.higherIsBetter) return (5 - v) / 4;
    var max = Math.max.apply(null, LEADERS.map(function (l) { return l[key]; }));
    return v / max;
  }
  function render(key) {
    var ranked = LEADERS.slice().sort(function (a, b) { return scale(key, b[key]) - scale(key, a[key]); });
    rowsEl.innerHTML = "";
    ranked.forEach(function (l) {
      var pct = Math.max(8, Math.round(scale(key, l[key]) * 100));
      var row = document.createElement("div");
      row.className = "lrc-row";
      row.innerHTML =
        '<img class="lrc-avatar" src="' + l.img + '" alt="' + l.name + '">' +
        '<div style="flex:1 1 auto; min-width:0;">' +
          '<div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px;">' +
            '<span class="body-strong" style="color:var(--ink-body);">' + l.name + '</span>' +
            '<span class="stat-lg" style="color:var(--ink-body);">' + METRICS[key].fmt(l[key]) + '</span>' +
          '</div>' +
          '<div class="lrc-track"><div style="position:absolute; inset:0 auto 0 0; width:' + pct + '%;">' +
            '<div class="paint-bg" style="background:' + l.color + ';"></div>' +
            '<div class="paint-fg" style="background:' + l.color + ';"></div>' +
          '</div></div>' +
        '</div>';
      rowsEl.appendChild(row);
    });
  }
  pickerEl.addEventListener("change", function (e) { render(e.target.value); });
  render(pickerEl.value);
})();
</script>
</body>
</html>
