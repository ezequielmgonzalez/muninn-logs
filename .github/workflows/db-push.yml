name: Push to Supabase

# Reusable: applies pending migrations and the config.toml settings (Auth,
# email templates, SMTP...) to one hosted project. The GitHub environment
# holds its project ref (variable) and database password (secret); the Gmail
# app password (SMTP) and the Google OAuth client secret are repository
# secrets shared by both projects.
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  contents: read

jobs:
  push:
    name: Push to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_AUTH_SMTP_PASS: ${{ secrets.SUPABASE_AUTH_SMTP_PASS }}
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Show pending migrations
        run: >
          pnpm supabase db push --dry-run
          --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply migrations
        run: >
          pnpm supabase db push
          --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      # config.toml's [remotes.*] block for this project ref supplies its URLs,
      # SMTP and other overrides. The diff is logged so every deploy shows
      # exactly which settings it changed.
      - name: Show config changes
        run: pnpm supabase config diff --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply config
        run: pnpm supabase config push --project-ref "$SUPABASE_PROJECT_REF" --yes
