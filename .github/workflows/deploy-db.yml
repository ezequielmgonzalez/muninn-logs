name: Deploy Supabase

# Merged to main: migrations and config reach staging, then production if
# staging succeeded. Opened or updated pull request: staging only, so its
# Vercel preview (which uses staging) runs against the PR's own schema.
# If an abandoned or rewritten PR leaves staging out of step with main, run
# the Reset staging workflow.
on:
  push:
    branches: [main]
    paths:
      - supabase/migrations/**
      - supabase/config.toml
      - supabase/templates/**
  pull_request:
    paths:
      - supabase/migrations/**
      - supabase/config.toml
      - supabase/templates/**
  # Run by hand, e.g. to bring a new project up to date.
  workflow_dispatch:

# Queue deploys instead of cancelling one halfway through a migration.
concurrency:
  group: deploy-db
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    uses: ./.github/workflows/db-push.yml
    with:
      environment: db-staging
    secrets: inherit

  production:
    # Pull requests never touch production.
    if: github.event_name != 'pull_request'
    needs: staging
    uses: ./.github/workflows/db-push.yml
    with:
      environment: db-production
    secrets: inherit
